<title>K4 Workspace — Chat &amp; Trợ lý AI (demo)</title>
<style>
  :root{
    --bg-rail: #1a1b22;
    --bg-side: #212228;
    --bg-side-hover: #2a2b33;
    --bg-main: #26272e;
    --bg-elevated: #2f303a;
    --bg-input: #383944;
    --border: #3a3b45;
    --text: #e7e8ee;
    --text-dim: #9a9ba5;
    --text-faint: #6f7079;
    --accent: #7c6cf6;
    --accent-hover: #8f81ff;
    --accent-soft: rgba(124,108,246,.16);
    --online: #3ba55d;
    --badge: #ef4a5e;
    --admin: #f0a23d;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg-main);
    color:var(--text);
    font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:15px;
    line-height:1.5;
    overflow:hidden;
  }
  button{font-family:inherit;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:#000;opacity:.2;border-radius:4px;}
  ::-webkit-scrollbar-track{background:transparent;}

  :focus-visible{outline:2px solid var(--accent-hover);outline-offset:2px;}

  .app{display:flex;height:100vh;width:100vw;}

  /* ---------- server rail ---------- */
  .rail{
    width:72px;flex-shrink:0;background:var(--bg-rail);
    display:flex;flex-direction:column;align-items:center;
    padding:12px 0;gap:8px;
  }
  .rail-icon{
    width:46px;height:46px;border-radius:16px;
    display:flex;align-items:center;justify-content:center;
    background:var(--bg-elevated);color:var(--text-dim);
    font-weight:700;font-size:15px;letter-spacing:.02em;
    cursor:pointer;border:none;transition:border-radius .15s,background .15s,color .15s;
    position:relative;
  }
  .rail-icon.active{background:var(--accent);color:#fff;border-radius:14px;}
  .rail-icon.active::before{
    content:"";position:absolute;left:-12px;top:50%;transform:translateY(-50%);
    width:4px;height:24px;border-radius:0 3px 3px 0;background:#fff;
  }
  .rail-icon:hover:not(.active){border-radius:14px;background:var(--accent);color:#fff;}
  .rail-sep{width:32px;height:2px;background:var(--border);border-radius:1px;margin:2px 0;}
  .rail-icon.add{color:var(--online);font-size:22px;font-weight:400;}
  .rail-icon.add:hover{background:var(--online);color:#fff;}

  /* ---------- channel sidebar ---------- */
  .sidebar{
    width:240px;flex-shrink:0;background:var(--bg-side);
    display:flex;flex-direction:column;min-width:0;
  }
  .sidebar-header{
    height:52px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;
    padding:0 14px;border-bottom:1px solid var(--border);
    font-weight:700;font-size:15px;box-shadow:0 1px 0 rgba(0,0,0,.15);
    cursor:default;
  }
  .sidebar-header .chev{color:var(--text-dim);font-size:11px;}
  .channel-scroll{flex:1;overflow-y:auto;padding:12px 8px 12px;}

  .cat{margin-bottom:4px;}
  .cat-head{
    display:flex;align-items:center;gap:4px;width:100%;
    background:none;border:none;color:var(--text-faint);
    font-size:12px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;
    padding:8px 4px 4px;cursor:pointer;
  }
  .cat-head:hover{color:var(--text-dim);}
  .cat-head .arrow{display:inline-block;transition:transform .15s;font-size:10px;}
  .cat.collapsed .arrow{transform:rotate(-90deg);}
  .cat.collapsed .cat-list{display:none;}
  .cat-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px;}

  .chan{
    display:flex;align-items:center;gap:6px;width:100%;
    background:none;border:none;text-align:left;
    color:var(--text-dim);padding:7px 8px;border-radius:6px;
    font-size:14.5px;cursor:pointer;position:relative;
  }
  .chan:hover{background:var(--bg-side-hover);color:var(--text);}
  .chan.active{background:var(--bg-elevated);color:#fff;}
  .chan .hash{opacity:.6;font-weight:600;}
  .chan.unread{color:#fff;font-weight:600;}
  .chan-badge{
    margin-left:auto;background:var(--badge);color:#fff;font-size:11px;font-weight:700;
    border-radius:8px;padding:1px 6px;min-width:18px;text-align:center;
    font-variant-numeric:tabular-nums;
  }
  .chan-dot{margin-left:auto;width:7px;height:7px;border-radius:50%;background:#fff;}

  .user-panel{
    height:56px;flex-shrink:0;background:#1c1d23;
    display:flex;align-items:center;gap:8px;padding:0 8px;
    border-top:1px solid var(--border);
  }
  .avatar{
    width:32px;height:32px;border-radius:50%;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:700;color:#fff;position:relative;
  }
  .avatar.lg{width:38px;height:38px;font-size:14px;}
  .status-dot{
    position:absolute;right:-2px;bottom:-2px;width:11px;height:11px;border-radius:50%;
    background:var(--online);border:2.5px solid #1c1d23;
  }
  .user-meta{min-width:0;flex:1;}
  .user-name{font-size:13.5px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .user-sub{font-size:11.5px;color:var(--text-dim);}
  .icon-btn{
    background:none;border:none;color:var(--text-dim);cursor:pointer;
    width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .icon-btn:hover{background:var(--bg-side-hover);color:var(--text);}

  /* ---------- main ---------- */
  .main{flex:1;display:flex;min-width:0;position:relative;background:var(--bg-main);}
  .chat-col{flex:1;min-width:0;display:flex;flex-direction:column;}

  .chat-header{
    height:52px;flex-shrink:0;display:flex;align-items:center;gap:8px;
    padding:0 16px;border-bottom:1px solid var(--border);box-shadow:0 1px 0 rgba(0,0,0,.15);
  }
  .chat-header .hash{color:var(--text-faint);font-size:20px;font-weight:600;}
  .chat-header .title{font-weight:700;font-size:16px;}
  .chat-header .topic{
    color:var(--text-dim);font-size:13px;margin-left:8px;padding-left:12px;border-left:1px solid var(--border);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .chat-header .spacer{flex:1;}
  .ai-toggle{
    display:flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent-hover);
    border:1px solid transparent;padding:6px 12px;border-radius:8px;font-size:13.5px;font-weight:600;
    cursor:pointer;transition:background .15s;
  }
  .ai-toggle:hover{background:rgba(124,108,246,.28);}
  .ai-toggle.is-open{background:var(--accent);color:#fff;}

  .messages{flex:1;overflow-y:auto;padding:16px 20px 8px;display:flex;flex-direction:column;gap:2px;}
  .msg{display:flex;gap:14px;padding:6px 4px;border-radius:6px;}
  .msg:hover{background:rgba(255,255,255,.02);}
  .msg .body{min-width:0;}
  .msg .line1{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
  .msg .author{font-weight:600;font-size:15px;color:#fff;}
  .msg .role-tag{
    font-size:10.5px;font-weight:700;background:var(--admin);color:#3a2600;
    padding:1px 6px;border-radius:4px;letter-spacing:.02em;
  }
  .msg .role-tag.bot{background:var(--accent);color:#fff;}
  .msg .time{font-size:11.5px;color:var(--text-faint);font-variant-numeric:tabular-nums;}
  .msg .text{color:#d6d7de;font-size:15px;white-space:pre-wrap;word-break:break-word;}
  .msg.self .author{color:#c9c2ff;}
  .mention{
    background:var(--accent-soft);color:var(--accent-hover);font-weight:600;
    padding:1px 5px;border-radius:4px;
  }
  .typing-dots{display:inline-flex;gap:3px;align-items:center;height:15px;}
  .typing-dots span{
    width:5px;height:5px;border-radius:50%;background:var(--text-dim);
    animation:bounce 1s infinite ease-in-out;
  }
  .typing-dots span:nth-child(2){animation-delay:.15s;}
  .typing-dots span:nth-child(3){animation-delay:.3s;}
  @keyframes bounce{0%,80%,100%{opacity:.3;transform:translateY(0);}40%{opacity:1;transform:translateY(-3px);}}

  /* ---------- forum-style "chủ đề" posts ---------- */
  .new-post-btn{
    background:var(--accent-soft);color:var(--accent-hover);border:none;
    padding:6px 12px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;
    margin-right:4px;white-space:nowrap;
  }
  .new-post-btn:hover{background:rgba(124,108,246,.28);}
  .back-btn{display:none;font-size:17px;}
  .crumb{color:var(--text-faint);font-weight:400;display:none;}
  .crumb-title{
    display:none;color:var(--text-dim);font-weight:600;font-size:15px;
    max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }

  .post-card{
    display:flex;gap:12px;width:100%;text-align:left;
    background:var(--bg-elevated);border:1px solid var(--border);border-radius:10px;
    padding:12px 14px;margin-bottom:10px;cursor:pointer;
  }
  .post-card:hover{border-color:var(--accent);background:var(--bg-side-hover);}
  .post-tag{
    font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:6px;white-space:nowrap;
    height:fit-content;flex-shrink:0;
  }
  .tag-resolved{background:rgba(59,165,93,.18);color:var(--online);}
  .tag-open{background:var(--accent-soft);color:var(--accent-hover);}
  .tag-discuss{background:rgba(240,162,61,.18);color:var(--admin);}
  .post-main{min-width:0;flex:1;display:flex;flex-direction:column;gap:4px;}
  .post-title{font-weight:700;font-size:15px;color:#fff;}
  .post-preview{font-size:13px;color:var(--text-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .post-meta{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text-faint);margin-top:2px;flex-wrap:wrap;}
  .post-meta .dot{opacity:.6;}
  .avatar.sm{width:20px;height:20px;font-size:9.5px;}

  .new-post-form{
    background:var(--bg-elevated);border:1px solid var(--border);border-radius:10px;
    padding:14px;margin-bottom:14px;display:flex;flex-direction:column;gap:10px;
  }
  .new-post-form input, .new-post-form textarea{
    background:var(--bg-input);border:1px solid var(--border);border-radius:8px;color:var(--text);
    font-family:inherit;font-size:14px;padding:8px 10px;
  }
  .new-post-form textarea{min-height:80px;resize:vertical;}
  .new-post-actions{display:flex;justify-content:flex-end;gap:8px;}
  .ghost-btn{
    background:none;border:1px solid var(--border);color:var(--text-dim);
    padding:7px 14px;border-radius:8px;cursor:pointer;font-size:13.5px;
  }
  .ghost-btn:hover{color:var(--text);border-color:var(--text-dim);}

  .msg.post-op{background:var(--bg-elevated);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:4px;}
  .msg.post-op:hover{background:var(--bg-elevated);}
  .post-detail-title{font-weight:700;font-size:17px;color:#fff;margin:2px 0 6px;}
  .reply-divider{
    color:var(--text-faint);font-size:12px;text-transform:uppercase;letter-spacing:.03em;
    margin:14px 4px 8px;border-bottom:1px solid var(--border);padding-bottom:6px;
  }

  .composer-wrap{padding:0 20px 16px;flex-shrink:0;}
  .composer{
    background:var(--bg-input);border-radius:10px;display:flex;align-items:center;gap:10px;
    padding:10px 14px;
  }
  .composer input{
    flex:1;background:none;border:none;color:var(--text);font-size:14.5px;font-family:inherit;
  }
  .composer input::placeholder{color:var(--text-faint);}
  .composer .send{
    background:none;border:none;color:var(--text-dim);cursor:pointer;display:flex;
  }
  .composer .send:hover{color:var(--accent-hover);}
  .composer .send:disabled{opacity:.35;cursor:default;}

  /* ---------- AI panel ---------- */
  .ai-panel{
    width:380px;flex-shrink:0;background:var(--bg-elevated);border-left:1px solid var(--border);
    display:flex;flex-direction:column;transition:width .22s ease,opacity .18s ease;overflow:hidden;
  }
  .ai-panel.closed{width:0;opacity:0;border-left:none;}
  .ai-inner{width:380px;display:flex;flex-direction:column;height:100%;}

  .ai-head{
    height:52px;flex-shrink:0;display:flex;align-items:center;gap:8px;padding:0 16px;
    border-bottom:1px solid var(--border);
  }
  .ai-head .bot-dot{width:8px;height:8px;border-radius:50%;background:var(--online);}
  .ai-head .title{font-weight:700;font-size:15px;}
  .ai-head .sub{color:var(--text-dim);font-size:11.5px;}
  .ai-head .spacer{flex:1;}

  .ai-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:16px;}
  .field label{
    display:block;font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;
    color:var(--text-dim);margin-bottom:6px;
  }
  .field textarea, .field input[type=text]{
    width:100%;background:var(--bg-input);border:1px solid var(--border);border-radius:8px;
    color:var(--text);font-family:inherit;font-size:13.5px;padding:10px 12px;resize:vertical;
  }
  .field textarea{min-height:110px;line-height:1.5;}
  .field textarea:focus,.field input[type=text]:focus{border-color:var(--accent);}
  .field textarea::placeholder,.field input::placeholder{color:var(--text-faint);}
  .field.error input{border-color:var(--badge);}
  .field .hint{font-size:12px;color:var(--badge);margin-top:5px;min-height:14px;}

  .example-btn{
    align-self:flex-start;background:none;border:1px dashed var(--border);color:var(--text-dim);
    font-size:12px;padding:5px 10px;border-radius:6px;cursor:pointer;
  }
  .example-btn:hover{border-color:var(--accent);color:var(--accent-hover);}

  .send-row{display:flex;justify-content:flex-end;}
  .send-btn{
    display:flex;align-items:center;gap:8px;background:var(--accent);color:#fff;border:none;
    padding:9px 16px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;
  }
  .send-btn:hover{background:var(--accent-hover);}
  .send-btn:disabled{opacity:.5;cursor:default;}

  .result-area{border-top:1px solid var(--border);padding-top:14px;}
  .result-empty{color:var(--text-faint);font-size:13px;text-align:center;padding:18px 6px;}

  .loading{display:flex;align-items:center;gap:10px;color:var(--text-dim);font-size:13.5px;padding:6px 2px;}
  .spinner{
    width:16px;height:16px;border-radius:50%;border:2px solid var(--border);border-top-color:var(--accent);
    animation:spin .7s linear infinite;flex-shrink:0;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  .result-card{
    background:var(--bg-input);border:1px solid var(--border);border-radius:10px;padding:14px;
    animation:rise .18s ease;
  }
  @keyframes rise{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
  .result-card .rhead{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .result-card .rmode{
    font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;
    color:var(--accent-hover);background:var(--accent-soft);padding:2px 8px;border-radius:5px;
  }
  .result-card .rtime{font-size:11.5px;color:var(--text-faint);margin-left:auto;font-variant-numeric:tabular-nums;}
  .result-card .rbody{font-size:13.5px;color:var(--text);white-space:pre-wrap;line-height:1.55;}
  .result-card .rsource{
    margin-top:10px;padding-top:10px;border-top:1px solid var(--border);
    font-size:12px;color:var(--text-dim);display:flex;gap:6px;align-items:flex-start;
  }
  .result-card .rsource b{color:var(--text);}

  @media (prefers-reduced-motion: reduce){
    *{animation:none !important;transition:none !important;}
  }
</style>

<div class="app">
  <!-- server rail -->
  <div class="rail">
    <button class="rail-icon active" title="K4 Workspace">K4</button>
    <div class="rail-sep"></div>
    <button class="rail-icon add" title="Thêm server">+</button>
  </div>

  <!-- channel sidebar -->
  <div class="sidebar">
    <div class="sidebar-header">
      <span>K4 Workspace</span>
      <span class="chev">▾</span>
    </div>
    <div class="channel-scroll" id="channelScroll"></div>
    <div class="user-panel">
      <div class="avatar lg" style="background:#7c6cf6">HH<span class="status-dot"></span></div>
      <div class="user-meta">
        <div class="user-name">Hoàng</div>
        <div class="user-sub">Đang hoạt động</div>
      </div>
      <button class="icon-btn" title="Cài đặt">⚙</button>
    </div>
  </div>

  <!-- main -->
  <div class="main">
    <div class="chat-col">
      <div class="chat-header">
        <button class="icon-btn back-btn" id="backBtn" title="Quay lại danh sách bài đăng">←</button>
        <span class="hash">#</span>
        <span class="title" id="chanTitle">chat-chung</span>
        <span class="crumb" id="crumbSep">/</span>
        <span class="title crumb-title" id="postTitleCrumb"></span>
        <span class="topic" id="chanTopic"></span>
        <span class="spacer"></span>
        <button class="new-post-btn" id="newPostBtn" style="display:none">+ Bài đăng mới</button>
        <button class="ai-toggle is-open" id="aiToggleBtn">🤖 Trợ lý AI</button>
      </div>
      <div class="messages" id="messages"></div>
      <div class="composer-wrap">
        <div class="composer">
          <button class="icon-btn" title="Đính kèm">📎</button>
          <button class="icon-btn" id="mentionBotBtn" title="Tag Trợ lý AI để hỏi ngay trong chat">🤖</button>
          <input type="text" id="composerInput" placeholder="Nhắn vào #chat-chung (gõ @Trợ lý AI để hỏi ngay)">
          <button class="send" id="composerSend" title="Gửi" disabled>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M3 11.5L21 3l-8.5 18-2.2-7.3L3 11.5z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>
    </div>

    <!-- AI assistant panel -->
    <div class="ai-panel" id="aiPanel">
      <div class="ai-inner">
        <div class="ai-head">
          <span class="bot-dot"></span>
          <div>
            <div class="title">Trợ lý AI</div>
            <div class="sub" id="aiModeSub">Chế độ: tóm tắt hội thoại</div>
          </div>
          <span class="spacer"></span>
          <button class="icon-btn" id="aiCloseBtn" title="Đóng">✕</button>
        </div>
        <div class="ai-body">
          <div class="field">
            <label for="docInput">Dán đoạn tài liệu / hội thoại</label>
            <textarea id="docInput" placeholder="Dán đoạn chat, tài liệu hoặc log lỗi vào đây..."></textarea>
          </div>
          <button class="example-btn" id="fillExample">Dùng ví dụ mẫu</button>
          <div class="field" id="qField">
            <label for="qInput">Câu hỏi của bạn</label>
            <input type="text" id="qInput" placeholder="VD: Tóm tắt đoạn hội thoại này giúp mình">
            <div class="hint" id="qHint"></div>
          </div>
          <div class="send-row">
            <button class="send-btn" id="askBtn">
              Gửi
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M3 11.5L21 3l-8.5 18-2.2-7.3L3 11.5z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
            </button>
          </div>
          <div class="result-area" id="resultArea">
            <div class="result-empty">Kết quả trả lời của Trợ lý AI sẽ hiện ở đây.</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  var AVATAR_COLORS = {
    "Hoàng":"#7c6cf6","Minh":"#4da3e0","Lan":"#3fc7b0","An":"#e8a23d",
    "Quản trị viên":"#f0a23d","Trợ lý AI":"#7c6cf6"
  };
  function initials(name){
    var parts = name.replace("Quản trị viên","QT").split(" ");
    return parts.length>1 ? (parts[0][0]+parts[parts.length-1][0]).toUpperCase() : name.slice(0,2).toUpperCase();
  }
  function avatarHtml(name, extraCls){
    var color = AVATAR_COLORS[name] || "#6f7079";
    return '<div class="avatar'+(extraCls?" "+extraCls:"")+'" style="background:'+color+'">'+initials(name)+'</div>';
  }

  var CHANNELS = {
    "thongbao-chung": {
      name:"thông-báo-chung", group:"thongbao",
      topic:"Thông báo chính thức từ quản trị viên nhóm",
      unread:0,

  /* ---------------- message / post rendering ---------------- */
  var MENTION_RE = /@\s?(Tr[oợ]\s?l[yý]\s?AI|bot|ai)\b/i;
  function highlightMentions(escapedText){
    return escapedText.replace(MENTION_RE, '<span class="mention">$&</span>');
  }

  function renderMsgHtml(msg){
    var h = '<div class="msg'+(msg.self?" self":"")+'">';
    h += avatarHtml(msg.a);
    h += '<div class="body"><div class="line1"><span class="author">'+msg.a+(msg.self?" (Bạn)":"")+'</span>';
    if(msg.role){ h += '<span class="role-tag'+(msg.a==="Trợ lý AI"?" bot":"")+'">'+msg.role+'</span>'; }
    h += '<span class="time">'+msg.t+'</span></div>';
    if(msg.typing){
      h += '<div class="text"><span class="typing-dots"><span></span><span></span><span></span></span></div>';
    } else {
      h += '<div class="text">'+highlightMentions(escapeHtml(msg.m))+'</div>';
    }
    h += '</div></div>';
    return h;
  }

  function renderChatBody(id){
    var html = "";
    CHANNELS[id].messages.forEach(function(msg){ html += renderMsgHtml(msg); });
    var box = document.getElementById("messages");
    box.innerHTML = html;
    box.scrollTop = box.scrollHeight;
  }

  function postCardHtml(p){
    var lastTime = p.replies.length ? p.replies[p.replies.length-1].t : p.t;
    return '<button class="post-card" data-post="'+p.id+'">'
      + '<span class="post-tag tag-'+tagClass(p.tag)+'">'+p.tag+'</span>'
      + '<div class="post-main">'
        + '<div class="post-title">'+escapeHtml(p.title)+'</div>'
        + '<div class="post-preview">'+escapeHtml(p.body).slice(0,90)+'</div>'
        + '<div class="post-meta">'+avatarHtml(p.a,"sm")+'<span>'+p.a+'</span>'
          + '<span class="dot">·</span><span>'+p.t+'</span>'
          + '<span class="dot">·</span><span>💬 '+p.replies.length+'</span>'
          + '<span class="dot">·</span><span>Hoạt động: '+lastTime+'</span>'
        + '</div>'
      + '</div></button>';
  }

  function renderPostDetail(chanId, postId){
    var p = getPost(chanId, postId);
    var html = '<div class="msg post-op">' + avatarHtml(p.a)
      + '<div class="body"><div class="line1"><span class="author">'+p.a+'</span>'
      + '<span class="post-tag tag-'+tagClass(p.tag)+'">'+p.tag+'</span>'
      + '<span class="time">'+p.t+'</span></div>'
      + '<div class="post-detail-title">'+escapeHtml(p.title)+'</div>'
      + '<div class="text">'+escapeHtml(p.body)+'</div></div></div>';
    html += '<div class="reply-divider">'+p.replies.length+' phản hồi</div>';

  document.getElementById("messages").addEventListener("click", function(e){
    if(getMode()==="forum-list"){

      if(postBtn){ activePost = postBtn.getAttribute("data-post"); showNewPostForm=false; render(); return; }
      var action = e.target.closest("[data-action]");

        var act = action.getAttribute("data-action");
        if(act==="cancel-new-post"){ showNewPostForm = false; render(); }
        if(act==="submit-new-post"){ submitNewPost(); }
      }
    }

  function submitNewPost(){
    var titleEl = document.getElementById("newPostTitle");
    var bodyEl = document.getElementById("newPostBody");
    var title = titleEl.value.trim();
    var body = bodyEl.value.trim();
    if(!title || !body){
      (title ? bodyEl : titleEl).focus();
      return;
    }
    CHANNELS[activeChan].posts.unshift({
      id:"p"+Date.now(), title:title, tag:"Đang mở", a:"Hoàng", t:nowShort(), body:body, replies:[]
    });
    showNewPostForm = false;
    render();
  }

  /* ---- composer: local echo (chat messages + post replies) ---- */
  var composerInput = document.getElementById("composerInput");
  var composerSend = document.getElementById("composerSend");
  var composerWrap = document.querySelector(".composer-wrap");
  function updateSendState(){ composerSend.disabled = composerInput.value.trim()===""; }
  composerInput.addEventListener("input", updateSendState);

  function updateComposer(){
    var mode = getMode();
    if(mode==="forum-list"){
      composerWrap.style.display = "none";
    } else {
      composerWrap.style.display = "";
      composerInput.placeholder = mode==="post-detail"
        ? "Trả lời bài đăng này... (gõ @Trợ lý AI để hỏi ngay)"
        : "Nhắn vào #"+CHANNELS[activeChan].name+" (gõ @Trợ lý AI để hỏi ngay)";
    }
  }

  function postOwnMessage(){
    var val = composerInput.value.trim();
    if(!val) return;
    var mode = getMode();
    var targetList;
    if(mode==="post-detail"){
      targetList = getPost(activeChan, activePost).replies;
    } else if(mode==="chat"){
      targetList = CHANNELS[activeChan].messages;
    } else {
      return;
    }
    targetList.push({a:"Hoàng", self:true, t:nowShort(), m:val});
    composerInput.value = "";
    updateSendState();
    render();
    if(MENTION_RE.test(val)){ respondAsBot(targetList); }
  }
  composerSend.addEventListener("click", postOwnMessage);
  composerInput.addEventListener("keydown", function(e){
    if(e.key==="Enter"){ e.preventDefault(); postOwnMessage(); }
  });

  document.getElementById("mentionBotBtn").addEventListener("click", function(){
    var mode = getMode();
    if(mode==="forum-list") return;
    var prefix = "@Trợ lý AI ";
    if(composerInput.value.trim()===""){ composerInput.value = prefix; }
    else if(!MENTION_RE.test(composerInput.value)){ composerInput.value = prefix + composerInput.value; }
    updateSendState();
    composerInput.focus();
    composerInput.setSelectionRange(composerInput.value.length, composerInput.value.length);
  });

  function respondAsBot(targetList){
    var placeholder = {a:"Trợ lý AI", role:"BOT", t:nowShort(), typing:true};
    targetList.push(placeholder);
    render();
    setTimeout(function(){
      var idx = targetList.indexOf(placeholder);
      if(idx===-1) return;
      var ans = buildAnswer("", "");
      var text = ans.body + (ans.source ? "\n↳ "+ans.source.replace(/<\/?b>/g,"") : "");
      targetList[idx] = {a:"Trợ lý AI", role:"BOT", t:nowShort(), m:text};
      render();
    }, 750);
  }

  function buildAnswer(question, doc){
    var group = CHANNELS[activeChan].group;
    var chanName = CHANNELS[activeChan].name;
    if(group==="chude"){
      var posts = CHANNELS[activeChan].posts;
      var answered = posts.find(function(p){ return p.replies.length>0; }) || posts[0];
      var firstReply = answered.replies[0];
      if(firstReply){
        return {
          mode:"Tìm kiếm trong kênh",
          body:'Trong #'+chanName+', bài đăng "'+answered.title+'" đã có người trả lời:\n\n"'+firstReply.m+'"',
          source:'Trả lời của <b>'+firstReply.a+'</b>, '+firstReply.t+' · bài đăng trong #'+chanName
        };
      }
      return {
        mode:"Tìm kiếm trong kênh",
        body:'Trong #'+chanName+', bài đăng "'+answered.title+'" hiện chưa có ai trả lời.',
        source:null
      };
    }
    if(group==="thongbao"){
      return {
        mode:"Tóm tắt thông báo",
        body:"• Check-point tiếp theo: Thứ Sáu 02/08, 19:00 — chuẩn bị demo & slide\n• Trợ lý AI vừa được bổ sung tính năng tóm tắt hội thoại và tìm kiếm trong kênh Chủ đề\n• Mốc 1 đã hoàn thành, Mốc 2 đang thực hiện",
        source:null
      };
    }
    return {
      mode:"Tóm tắt hội thoại",
      body:"• Cả nhóm thống nhất họp lúc 20h30 tối nay\n• An hỏi về flow đăng nhập, Minh sẽ kiểm tra lại trong #hỏi-đáp\n• Chưa có việc nào đang bị chặn",

    };

  askBtn.addEventListener("click", function(){
    var question = qInput.value.trim();
    var doc = document.getElementById("docInput").value.trim();
    if(!question){
      qField.classList.add("error");
      qHint.textContent = "Nhập câu hỏi trước khi gửi nhé.";
      qInput.focus();
      return;
    }
    askBtn.disabled = true;
    resultArea.innerHTML = '<div class="loading"><span class="spinner"></span> Trợ lý AI đang phân tích'+(doc?" tài liệu":"")+'...</div>';

    setTimeout(function(){
      var ans = buildAnswer(question, doc);
      var html = '<div class="result-card">';
      html += '<div class="rhead"><span class="rmode">'+ans.mode+'</span><span class="rtime">'+nowLabel()+'</span></div>';
      html += '<div class="rbody">Câu hỏi: “'+escapeHtml(question)+'”\n\n'+escapeHtml(ans.body)+'</div>';
      if(ans.source){
        html += '<div class="rsource">↳ '+ans.source+'</div>';
      }
      html += '</div>';
      resultArea.innerHTML = html;
      askBtn.disabled = false;
    }, 750);
  });

  render();
})();
</script>
